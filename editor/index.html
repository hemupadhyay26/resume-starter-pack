<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resume editor</title><link rel="stylesheet" href="/resume.css"><style id="print-page"></style></head>
<body><header class="toolbar"><div><strong>Resume</strong><span id="status" role="status">Loading preview…</span></div><div class="toolbar-actions"><button id="toggle-editor" type="button" aria-controls="editor-sidebar" aria-expanded="true" aria-label="Collapse editor" title="Collapse editor"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="m16 9-3 3 3 3"/></svg></button><button id="save" disabled>Save changes</button><a class="view-button" href="/?view=resume" target="_blank" rel="noopener">Resume only</a><button id="print" disabled>Print / Save PDF</button></div></header>
<div class="workspace"><aside class="edit-sidebar" id="editor-sidebar"><div class="save-row"><span id="save-status" role="status">Loading saved resume…</span><button id="reload" type="button">Reload saved data</button></div><p class="editor-help">Edit below to update the preview. Save writes your changes to this computer. Resume only shows the last saved version.</p><div id="editor-panel"></div></aside><div id="sidebar-resize" class="sidebar-resize" role="separator" aria-label="Resize editor panel" aria-controls="editor-sidebar" aria-orientation="vertical" tabindex="0" title="Drag to resize; arrow keys to adjust; double-click to reset"></div>
<main><p class="hint">Live preview · save before pushing · adjust spacing if content exceeds the page</p><article id="page" aria-label="Resume"><div id="content"></div></article></main></div>
<script type="module" src="/preview.js"></script>
<script type="module">if(new URLSearchParams(location.search).get('view')!=='resume') import('/edit.js');</script>
</body></html>
