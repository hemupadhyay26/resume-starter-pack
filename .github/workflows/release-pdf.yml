name: Build release PDF

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: resume-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run validate
      - name: Build versioned PDF
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: npm run build:pdf -- "$RELEASE_TAG"
      - name: Attach PDF to this release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" output/resume-*.pdf
